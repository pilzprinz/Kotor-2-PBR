; PBR mod configuration file.
; Place next to opengl32.dll in the KOTOR2 game directory.
; All settings have safe defaults — the mod works even if this file is missing.

[general]
; Master switches for each subsystem. Disable a subsystem if it causes issues
; on your specific GPU/driver combination.
enable_pbr=1           ; PBR texture hooks + sibling loading (normal/rough/metal)
enable_shadows=1       ; directional sun shadow map (FBO + caster pass)
enable_depth_capture=0 ; depth buffer snapshot (currently disabled — SS shadow cut)
enable_file_logger=1   ; CreateFile IAT hook + path logging to logs/pbr_file_log.txt
enable_glsl_pilot=0    ; GLSL material replacement pilot (experimental)
enable_tune_overlay=1  ; in-game DEL tuning overlay

[logging]
; Log verbosity. 0=off, 1=normal (warnings + key events), 2=verbose (per-draw census).
log_level=1
; Write to logs/pbr_file_log.txt (general mod log).
log_to_file=1
; Write to pbr_tune_diag.log (shadow/glsl diagnostics — always useful).
log_to_diag=1

[performance]
; Show FPS + draw call counter overlay (toggle with stats_hotkey).
show_stats=0
; Hotkey to toggle stats overlay (Windows VK code, hex). 0x23 = VK_END.
stats_hotkey=0x23
; Max cached caster meshes for the shadow map geometry cache.
; Higher = more stable shadows on backtracking, more memory. 6000 is plenty.
shadow_max_cache=6000
; Max cached PBR sibling sets (normal/rough/metal per texture name).
; 0 = unlimited (may grow over long sessions). 500 evicts oldest when exceeded.
sibling_cache_limit=500

[safety]
; Wrap DllMain init in structured exception handling (SEH).
; If a subsystem crashes during init, the game continues with that subsystem disabled.
exception_handler=1